[tox]
env_list =
    ruff
    py{310,311,312,313,314}-dj52
    py{312,313,314}-dj60

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314

[testenv]
package = editable
passenv =
    CI
    CONSTANTS_DATABASE_ENGINE
    CONSTANTS_DATABASE_HOST
    CONSTANTS_DATABASE_NAME
    CONSTANTS_DATABASE_USER
deps =
    coverage
    pytest
    pytest-django
    djangorestframework>=3.14
    dj52: Django>=5.2,<5.3
    dj60: Django>=6.0,<6.1
    djmain: https://github.com/django/django/tarball/main
setenv =
    DJANGO_SETTINGS_MODULE=konst.tests.settings
commands =
    coverage run -m pytest konst/tests/tests.py {posargs}
    coverage report -m --skip-covered

[testenv:ruff]
skip_install = true
deps =
    ruff == 0.9.6
commands =
    ruff check konst
    ruff format --check konst
